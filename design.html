<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Wealth Wise</title>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --pr: #c9a84c;
      --ok: #2ecc71;
      --er: #e53935;
      --in: #4a9eff;
      --pu: #8b7cf6;
      --f: Montserrat, system-ui, sans-serif
    }

    body.dark {
      --bg: #080808;
      --b2: #111;
      --b3: #181818;
      --b4: #242424;
      --bd: #262626;
      --t1: #f2f2f2;
      --t2: #a0a0a0;
      --t3: #6c6c6c;
      --prd: #c9a84c22;
      --okd: #0e2a1a;
      --erd: #2a0e0e;
      --ind: #0a1a2a;
      --pud: #16103a
    }

    body.light {
      --bg: #f4f5f9;
      --b2: #fff;
      --b3: #f1f3f9;
      --b4: #e3e7f1;
      --bd: #e3e6ef;
      --t1: #0f172a;
      --t2: #475569;
      --t3: #7a879b;
      --prd: #f6efe0;
      --okd: #e8f7ee;
      --erd: #fdecec;
      --ind: #eaf1ff;
      --pud: #f1edff;
      --ok: #16a34a;
      --er: #dc2626;
      --in: #2563eb;
      --pu: #7c3aed
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0
    }

    body {
      font-family: var(--f);
      background: var(--bg);
      color: var(--t1);
      display: flex;
      justify-content: center
    }

    button {
      font-family: var(--f)
    }

    .app {
      width: 100%;
      max-width: 430px;
      height: 100vh;
      height: 100dvh;
      position: relative;
      display: flex;
      flex-direction: column;
      background: var(--bg);
      overflow: hidden
    }

    @media(min-width:500px) {
      body {
        padding: 16px 0
      }

      .app {
        height: min(880px, calc(100vh - 32px));
        border: 1px solid var(--bd);
        border-radius: 36px
      }
    }

    .top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 0
    }

    .logo {
      font-weight: 700;
      font-size: 15px
    }

    .logo b {
      color: var(--pr)
    }

    .ib {
      background: var(--b2);
      border: 1px solid var(--bd);
      color: var(--t2);
      border-radius: 50%;
      width: 34px;
      height: 34px;
      cursor: pointer
    }

    #main {
      flex: 1;
      overflow-y: auto;
      padding-bottom: 100px;
      scrollbar-width: none
    }

    .nav {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      display: flex;
      background: var(--b2);
      border-top: 1px solid var(--bd);
      padding: 8px 0 16px;
      z-index: 5
    }

    .nav button {
      flex: 1;
      background: none;
      border: 0;
      color: var(--t3);
      font-size: 10px;
      font-weight: 600;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 3px
    }

    .nav i {
      font-style: normal;
      font-size: 18px;
      line-height: 1
    }

    .nav .on {
      color: var(--pr)
    }

    .hd {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px 0
    }

    h1 {
      font-size: 22px;
      font-weight: 700;
      letter-spacing: -.5px
    }

    .card {
      margin: 14px 20px 0;
      background: var(--b2);
      border: 1px solid var(--bd);
      border-radius: 18px;
      padding: 18px
    }

    .lbl {
      font-size: 10px;
      font-weight: 600;
      color: var(--t3);
      margin-bottom: 6px
    }

    .big {
      font-size: 30px;
      font-weight: 700;
      letter-spacing: -1px
    }

    .sub {
      font-size: 12px;
      font-weight: 500;
      margin-top: 4px
    }

    .pills {
      display: flex;
      gap: 8px;
      margin-top: 14px
    }

    .pill {
      flex: 1;
      background: var(--b3);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 10px 12px
    }

    .pill .lbl {
      margin-bottom: 3px
    }

    .pv {
      font-size: 13px;
      font-weight: 700
    }

    .trk {
      height: 4px;
      border-radius: 2px;
      background: var(--b4);
      overflow: hidden;
      margin-top: 10px
    }

    .fl {
      height: 100%;
      border-radius: 2px;
      min-width: 2px
    }

    .sec {
      font-size: 12px;
      font-weight: 700;
      color: var(--t3);
      margin: 20px 20px 10px
    }

    .it {
      background: var(--b2);
      border: 1px solid var(--bd);
      border-radius: 14px;
      padding: 14px;
      margin: 0 20px 10px
    }

    .it[data-a] {
      cursor: pointer
    }

    .dim {
      opacity: .55
    }

    .rw {
      display: flex;
      justify-content: space-between;
      gap: 10px;
      align-items: flex-start
    }

    .r {
      text-align: right
    }

    .nm {
      font-size: 13px;
      font-weight: 600
    }

    .mt {
      font-size: 11px;
      font-weight: 500;
      color: var(--t3);
      margin-top: 2px
    }

    .am {
      font-size: 14px;
      font-weight: 700
    }

    .st {
      font-size: 11px;
      color: var(--t2);
      margin-top: 8px;
      line-height: 1.6
    }

    .acts {
      display: flex;
      gap: 6px;
      margin-top: 12px;
      padding-top: 12px;
      border-top: 1px solid var(--bd);
      flex-wrap: wrap
    }

    .bs {
      background: var(--b3);
      border: 1px solid var(--bd);
      color: var(--t2);
      border-radius: 8px;
      padding: 7px 11px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer
    }

    .bs.p {
      color: var(--pr);
      background: var(--prd);
      border-color: transparent
    }

    .bs.d {
      color: var(--er)
    }

    .chips {
      display: flex;
      gap: 6px;
      padding: 12px 20px 0;
      overflow-x: auto;
      scrollbar-width: none
    }

    .chip {
      white-space: nowrap;
      background: var(--b3);
      border: 1px solid var(--bd);
      color: var(--t3);
      border-radius: 20px;
      padding: 6px 14px;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer
    }

    .chip.on {
      background: var(--prd);
      color: var(--pr)
    }

    .tx {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 11px 0;
      border-bottom: 1px solid var(--bd);
      cursor: pointer
    }

    .ico {
      width: 36px;
      height: 36px;
      border-radius: 11px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      flex-shrink: 0
    }

    .fx {
      flex: 1;
      min-width: 0
    }

    .nm,
    .mt {
      overflow-wrap: anywhere
    }

    .day {
      font-size: 11px;
      font-weight: 700;
      color: var(--t3);
      margin: 14px 0 2px
    }

    .qa {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 8px;
      margin: 14px 20px 0
    }

    .qa button {
      background: var(--b2);
      border: 1px solid var(--bd);
      border-radius: 12px;
      padding: 14px 4px;
      font-size: 11px;
      font-weight: 600;
      color: var(--t2);
      cursor: pointer
    }

    .fab {
      position: absolute;
      bottom: 92px;
      right: 20px;
      width: 50px;
      height: 50px;
      border-radius: 50%;
      background: var(--pr);
      color: #111;
      font-size: 26px;
      border: 0;
      cursor: pointer;
      z-index: 4
    }

    .wn {
      margin: 12px 20px 0;
      padding: 10px 12px;
      border-radius: 10px;
      background: var(--erd);
      color: var(--er);
      font-size: 11px;
      font-weight: 600
    }

    .ov {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, .55);
      display: flex;
      align-items: flex-end;
      z-index: 20
    }

    .sh {
      background: var(--b2);
      width: 100%;
      max-height: 92%;
      overflow-y: auto;
      border-radius: 22px 22px 0 0;
      padding: 18px 18px 26px
    }

    .shh {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 14px;
      font-size: 16px
    }

    .lb {
      display: block;
      font-size: 11px;
      font-weight: 600;
      color: var(--t2);
      margin-bottom: 5px
    }

    .in {
      width: 100%;
      background: var(--b3);
      border: 1px solid var(--bd);
      color: var(--t1);
      border-radius: 10px;
      padding: 11px 12px;
      font-size: 13px;
      font-weight: 500;
      font-family: var(--f)
    }

    .in.bad {
      border-color: var(--er)
    }

    .in:focus {
      outline: 2px solid var(--pr);
      outline-offset: 1px
    }

    .err {
      color: var(--er);
      font-size: 11px;
      min-height: 15px;
      margin: 3px 0 6px
    }

    .cta {
      width: 100%;
      background: var(--pr);
      color: #111;
      border: 0;
      border-radius: 14px;
      padding: 14px;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      margin-top: 4px
    }

    .cta.del {
      background: var(--erd);
      color: var(--er)
    }

    .lg {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 10px 0;
      border-bottom: 1px solid var(--bd)
    }

    .mi {
      width: 100%;
      text-align: left;
      background: var(--b3);
      border: 1px solid var(--bd);
      color: var(--t1);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 8px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer
    }

    button:focus-visible,
    .chip:focus-visible {
      outline: 2px solid var(--pr);
      outline-offset: 2px
    }
  </style>
</head>

<body class="dark">
  <div class="app">
    <div class="top">
      <div class="logo">Wealth<b>Wise</b></div><button class="ib" data-a="theme" aria-label="Toggle theme">◐</button>
    </div>
    <main id="main"></main>
    <nav class="nav">
      <button data-a="go" data-id="home"><i>⌂</i>Home</button>
      <button data-a="go" data-id="tx"><i>≡</i>Transactions</button>
      <button data-a="go" data-id="goals"><i>◎</i>Goals</button>
      <button data-a="go" data-id="inv"><i>↗</i>Invest</button>
      <button data-a="go" data-id="more"><i>⋯</i>More</button>
    </nav>
    <div id="ov"></div>
  </div>
  <script>
    /* ---------- helpers ---------- */
    const $ = s => document.querySelector(s), Y = new Date().getFullYear();
    const iso = (d = new Date()) => new Date(d - d.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
    const ago = n => { const d = new Date(); d.setDate(d.getDate() - n); return iso(d) };
    const inr = n => (n < 0 ? '-' : '') + '₹' + Math.abs(Math.round(n)).toLocaleString('en-IN');
    const sh = n => { const a = Math.abs(n), s = n < 0 ? '-' : ''; return s + (a >= 1e7 ? '₹' + (a / 1e7).toFixed(2) + ' Cr' : a >= 1e5 ? '₹' + (a / 1e5).toFixed(2) + ' L' : '₹' + Math.round(a).toLocaleString('en-IN')) };
    const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
    const uid = () => Math.random().toString(36).slice(2, 9);
    const pct = (a, b) => b > 0 ? Math.min(100, Math.max(0, a / b * 100)) : 0;
    const cap = s => s[0].toUpperCase() + s.slice(1);
    const mon = m => new Date(m + '-01T00:00').toLocaleDateString('en-IN', { month: 'long', year: 'numeric' });
    const fdate = d => new Date(d + 'T00:00').toLocaleDateString('en-IN', { day: 'numeric', month: 'short', year: 'numeric' });
    const mmy = n => { const d = new Date(); d.setMonth(d.getMonth() + n); return d.toLocaleDateString('en-IN', { month: 'short', year: 'numeric' }) };
    const dup = (a, n, id) => a.some(x => x.id !== id && x.name.toLowerCase() === n.toLowerCase());
    const up = (a, e, o, x = {}) => e ? Object.assign(e, o) : a.push({ id: uid(), ...o, ...x });
    const em = t => `<div class="mt" style="margin:14px 20px">${t}</div>`;

    /* ---------- state ---------- */
    const KEY = 'wealthwise.v2'; let S, V = 'home', M = iso().slice(0, 7), F = 'all', Q = '', IT = 'All', CF = null;
    const seed = () => ({
      theme: 'dark', extra: 2000,
      tx: [['income', 47000, 'Salary', 'Salary', 3], ['income', 3000, 'Freelance', 'Side income', 3], ['expense', 15000, 'Living', 'Rent and hostel', 2], ['expense', 7000, 'Family', 'Monty fees', 2], ['invest', 2000, 'Investment', 'ICICI RD', 1], ['expense', 5713, 'EMI', 'Bank EMI', 1]].map(([type, amt, cat, note, d]) => ({ id: uid(), type, amt, cat, note, date: ago(d) })),
      goals: [['First ₹5L portfolio', 500000, 315841, Y], ['Home - Nagpur', 10000000, 0, 2041], ['Poultry farm', 200000, 0, Y]].map(([name, target, saved, year]) => ({ id: uid(), name, target, saved, year })),
      inv: [['EPFO - PF', 'Pension / PF', 96985, 135385], ['HDFC Fixed Deposit', 'Fixed deposit', 110000, 135456], ['ICICI RD', 'Recurring deposit', 22000, 22000]].map(([name, type, invested, value]) => ({ id: uid(), name, type, invested, value })),
      ef: [{ id: uid(), date: ago(60), amt: 153000, note: 'Opening balance' }, { id: uid(), date: ago(1), amt: 2000, note: 'ICICI RD' }],
      sips: [['Retirement fund', 'monthly', 21200, 12, 6, 34, ago(30)], ['Home - Nagpur', 'monthly', 10000, 12, 6, 15, '2027-01-01'], ['Audi car fund', 'monthly', 2000, 12, 6, 16, '2027-01-01']].map(([name, freq, amt, rate, step, tenure, start]) => ({ id: uid(), name, freq, amt, rate, step, tenure, start, logs: [] })),
      loans: [{
        id: uid(), name: 'Bank EMI', principal: 330000, rate: 11, tenure: 72, emi: 5713, start: '2026-04-01',
        logs: [0, 1, 2, 3, 4, 5].map(k => iso(new Date(2026, 3 + k, 5))).filter(d => d <= iso()).map(date => ({ id: uid(), date, amt: 5713, type: 'EMI', note: '' }))
      }]
    });
    try { S = JSON.parse(localStorage.getItem(KEY)) } catch (e) { }
    function migrate() {
      const T = { 'Equity / MF': 'Mutual fund / SIP', 'Pension / PF': 'EPFO / PF', 'Gold / Silver': 'Gold' };
      if (S.sips) { S.sips.forEach(x => S.inv.push({ id: x.id, name: x.name, type: 'Mutual fund / SIP', freq: x.freq, amt: x.amt, rate: x.rate, step: x.step, tenure: x.tenure, start: x.start, opening: 0, actual: null, logs: x.logs || [] })); delete S.sips }
      S.inv.forEach(h => { if (T[h.type]) h.type = T[h.type] })
    }
    if (!S || !S.tx) S = seed();
    migrate();
    const save = () => { try { localStorage.setItem(KEY, JSON.stringify(S)) } catch (e) { } };

    /* ---------- calculators ---------- */
    const PER = { daily: 365, weekly: 52, monthly: 12, yearly: 1 }, U = { daily: 'day', weekly: 'wk', monthly: 'mo', yearly: 'yr' };
    const sipProj = s => {
      const n = PER[s.freq], ir = Math.pow(1 + s.rate / 100, 1 / n) - 1, T = Math.round(s.tenure * n); let v = 0, inv = 0;
      for (let i = 0; i < T; i++) { const a = s.amt * Math.pow(1 + s.step / 100, Math.floor(i / n)); v = v * (1 + ir) + a; inv += a } return { fv: v, inv }
    };
    const sipNow = s => {
      const d = (new Date() - new Date(s.start + 'T00:00')) / 864e5, n = PER[s.freq], T = s.tenure * n;
      return { due: d < 0 ? 0 : Math.min(T, Math.floor(d * n / 365) + 1), cur: s.amt * Math.pow(1 + s.step / 100, Math.max(0, Math.floor(d / 365))), got: s.logs.length, paid: s.logs.reduce((a, l) => a + l.amt, 0) }
    };
    const emiAuto = (P, r, n) => { const i = r / 1200; return Math.round(i ? P * i * Math.pow(1 + i, n) / (Math.pow(1 + i, n) - 1) : P / n) };
    const loanState = l => {
      let B = l.principal, last = new Date(l.start + 'T00:00'), paid = 0, int = 0;
      const acc = to => { const it = B * l.rate / 100 * Math.max(0, (to - last) / 864e5) / 365; B += it; int += it; if (to > last) last = to };
      [...l.logs].sort((a, b) => a.date < b.date ? -1 : 1).forEach(p => { acc(new Date(p.date + 'T00:00')); B = Math.max(0, B - p.amt); paid += p.amt });
      acc(new Date()); return { bal: B, paid, int }
    };
    const mLeft = (B, e, r, x = 0) => { if (B < 1) return 0; e += x; const i = r / 1200; if (!i) return Math.ceil(B / e); if (e <= B * i) return Infinity; return Math.ceil(-Math.log(1 - B * i / e) / Math.log(1 + i)) };
    const monthly = k => { const m = {}; S.tx.filter(t => t.type === k).forEach(t => { const x = t.date.slice(0, 7); m[x] = (m[x] || 0) + t.amt }); const x = Object.keys(m).sort().pop(); return x ? m[x] : 0 };
    const sipVal = s => s.logs.reduce((a, l) => a + l.amt * Math.pow(1 + s.rate / 100, Math.max(0, (new Date() - new Date(l.date + 'T00:00')) / 31557600000)), 0);
    const isPlan = h => !!h.freq;
    const hInv = h => isPlan(h) ? (h.opening || 0) + sipNow(h).paid : h.invested;
    const hVal = h => isPlan(h) ? (h.actual != null ? h.actual : (h.opening || 0) + sipVal(h)) : h.value;
    const tot = () => { const man = S.inv.reduce((a, h) => a + hVal(h), 0), ef = S.ef.reduce((a, e) => a + e.amt, 0), liab = S.loans.reduce((a, l) => a + loanState(l).bal, 0), assets = man + ef; return { man, ef, liab, assets, nw: assets - liab } };
    const gSaved = g => g.auto === 'ef' ? tot().ef : g.saved;

    /* ---------- sheet + validated form engine ---------- */
    const openSheet = (t, h) => { $('#ov').innerHTML = `<div class="ov"><div class="sh" role="dialog" aria-modal="true"><div class="shh"><b>${t}</b><button class="ib" data-a="x" aria-label="Close">✕</button></div>${h}</div></div>` };
    const closeSheet = () => { $('#ov').innerHTML = ''; CF = null };
    function form(c) {
      CF = c; const v = c.val || {};
      const fld = f => {
        const val = v[f.k] ?? f.d ?? '';
        const el = f.t === 'select' ? `<select class="in" name="${f.k}">${f.o.map(o => `<option${o == val ? ' selected' : ''}>${esc(o)}</option>`).join('')}</select>`
          : `<input class="in" name="${f.k}" type="${f.t || 'text'}" value="${esc(val)}"${f.t === 'number' ? ' step="any" inputmode="decimal"' : ''}${f.mx ? ` max="${f.mx}"` : ''}${f.mn ? ` min="${f.mn}"` : ''}${f.p ? ` placeholder="${esc(f.p)}"` : ''}>`;
        return `<label class="lb">${f.l}</label>${el}<div class="err" data-e="${f.k}"></div>`
      };
      openSheet(c.title, `<form novalidate>${c.fields.map(fld).join('')}<button class="cta">${c.ok || 'Save'}</button>${c.del ? '<button type="button" class="cta del" data-a="fdel">Delete</button>' : ''}</form>`);
      const fm = $('#ov form');
      fm.onsubmit = e => {
        e.preventDefault(); const o = {}, er = {};
        c.fields.forEach(f => {
          const r = fm.elements[f.k].value.trim();
          if (!r) { if (f.r) er[f.k] = 'Required'; o[f.k] = f.t === 'number' ? null : ''; return }
          let x = r;
          if (f.t === 'number') {
            x = Number(r);
            if (!isFinite(x)) er[f.k] = 'Enter a valid number';
            else if (f.i && !Number.isInteger(x)) er[f.k] = 'Whole numbers only';
            else if (f.min != null && x < f.min) er[f.k] = 'Minimum is ' + f.min;
            else if (f.max != null && x > f.max) er[f.k] = 'Maximum is ' + f.max.toLocaleString('en-IN')
          }
          else if (f.t === 'date') {
            if (isNaN(new Date(r))) er[f.k] = 'Enter a valid date';
            else if (f.mx && r > f.mx) er[f.k] = 'Date cannot be after ' + fdate(f.mx);
            else if (f.mn && r < f.mn) er[f.k] = 'Date cannot be before ' + fdate(f.mn)
          }
          else if (f.n && r.length > f.n) er[f.k] = 'Maximum ' + f.n + ' characters';
          o[f.k] = x
        });
        if (!Object.keys(er).length) Object.assign(er, c.check ? c.check(o) || {} : {});
        fm.querySelectorAll('.err').forEach(d => { d.textContent = er[d.dataset.e] || ''; fm.elements[d.dataset.e].classList.toggle('bad', !!er[d.dataset.e]) });
        const first = Object.keys(er)[0]; if (first) { fm.elements[first].focus(); return }
        c.save(o); save(); (c.after || closeSheet)(); render()
      };
    }

    /* ---------- forms per instrument ---------- */
    const CATS = ['Salary', 'Freelance', 'Living', 'Food', 'Transport', 'Family', 'EMI', 'Shopping', 'Health', 'Investment', 'Other'];

      pm: () => { const d = new Date(M + '-01T00:00'); d.setMonth(d.getMonth() - 1); M = iso(d).slice(0, 7); render() },
      nm: () => { const d = new Date(M + '-01T00:00'); d.setMonth(d.getMonth() + 1); M = iso(d).slice(0, 7); render() },
      flt: id => { F = id; render() }, itab: id => { IT = id; render() },
      addTx: () => txForm(), editTx: id => txForm(by(S.tx, id)),
      addGoal: () => goalForm(), editGoal: id => goalForm(by(S.goals, id)),
      addInv: () => invForm(), editInv: id => { const h = by(S.inv, id); isPlan(h) ? planForm(h) : invForm(h) },
      addEf: () => efForm(),
      delEf: id => { if (confirm('Delete this entry?')) { S.ef = S.ef.filter(e => e.id !== id); save(); render() } },
      addPlan: () => planForm(), logSip: id => logForm('sip', id), sipLogs: id => logs('sip', id),
      addLoan: () => loanForm(), editLoan: id => loanForm(by(S.loans, id)), loanLogs: id => logs('loan', id),
      payEmi: id => { const l = by(S.loans, id), amt = Math.min(l.emi, Math.ceil(loanState(l).bal)); if (confirm(`Log an EMI payment of ${inr(amt)} for today?`)) { l.logs.push({ id: uid(), date: iso(), amt, type: 'EMI', note: '' }); save(); render() } },
      addLog: (id, el) => logForm(el.dataset.k, id), editLog: (id, el) => logForm(el.dataset.k, id, el.dataset.l),
      delLog: (id, el) => { const o = own(el.dataset.k, id); if (confirm('Delete this entry?')) { o.logs = o.logs.filter(l => l.id !== el.dataset.l); save(); logs(el.dataset.k, id); render() } },
      fdel: () => { if (!confirm('Delete this item and its history?')) return; try { CF.del() } catch (e) { return } save(); closeSheet(); render() },
      exp: () => { const a = document.createElement('a'); a.href = URL.createObjectURL(new Blob([JSON.stringify(S, null, 2)], { type: 'application/json' })); a.download = 'wealthwise-' + iso() + '.json'; a.click() },
      reset: () => { if (confirm('Replace all data with the demo data? This cannot be undone.')) { S = seed(); migrate(); ensureEfGoal(); V = 'home'; closeSheet(); render() } }
    };
    function openMore() { openSheet('More', [['go', 'loan', 'Loans'], ['go', 'ef', 'Emergency fund'], ['exp', '', 'Export data (JSON)'], ['theme', '', 'Switch theme'], ['reset', '', 'Reset to demo data']].map(([a, id, l]) => `<button class="mi" data-a="${a}" data-id="${id}">${l}</button>`).join('')) }

    document.addEventListener('click', e => {
      if (e.target.classList.contains('ov')) return closeSheet();
      const el = e.target.closest('[data-a]'); if (el && A[el.dataset.a]) A[el.dataset.a](el.dataset.id, el)
    });
    document.addEventListener('change', e => {
      const c = e.target.dataset.ch; if (!c) return;
      if (c === 'q') Q = e.target.value;
      if (c === 'extra') { const x = Number(e.target.value); S.extra = isFinite(x) && x >= 0 && x <= 1e6 ? Math.round(x) : 0; save() }
      render()
    });
    document.addEventListener('keydown', e => { if (e.key === 'Escape') closeSheet() });
    function ensureEfGoal() {
      const g = S.goals.find(x => x.auto === 'ef') || S.goals.find(x => x.name.toLowerCase() === 'emergency fund');
      if (!g) S.goals.unshift({ id: uid(), name: 'Emergency fund', target: Math.round(monthly('expense') * 6 / 1000) * 1000 || 300000, saved: 0, year: Y + 2, auto: 'ef' });
      else { g.auto = 'ef'; if (S.goals[0] !== g) { S.goals = S.goals.filter(x => x !== g); S.goals.unshift(g) } } save()
    }
    ensureEfGoal();
    render();
  </script>
</body>
