name: Bug report
description: Report a reproducible problem or unexpected behavior
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        ### Important Privacy Notice
        WealthWise is an offline-first financial tracker. **Do not include real financial records, transaction numbers, account details, passwords, secret keys, or backup files in public issues.** Use synthetic or placeholder values.
  - type: input
    id: version
    attributes:
      label: WealthWise Version
      description: What version of the app are you running? (e.g., 1.3.0)
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Operating System and Device
      description: What OS and device model are you using? (e.g., Android 15, iOS 18)
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of the issue.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Step-by-step instructions to reproduce the problem.
      placeholder: |
        1. Go to '...'
        2. Tap on '...'
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen instead?
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: Confirmation
      options:
        - label: I confirm that I have not included any real personal financial data, account numbers, credentials, or backup files in this report.
          required: true
